/* ========== Firma digitale (canvas) ========== */
let sigCtx = null, sigDrawing = false, sigVuota = true;

function initFirma() {
  const canvas = document.getElementById('sig-canvas');
  if (!canvas) return;
  const box = canvas.parentElement;
  const ratio = window.devicePixelRatio || 1;
  const w = box.clientWidth, h = 150;
  canvas.width = w * ratio;
  canvas.height = h * ratio;
  sigCtx = canvas.getContext('2d');
  sigCtx.scale(ratio, ratio);
  sigCtx.lineWidth = 2.2;
  sigCtx.lineCap = 'round';
  sigCtx.strokeStyle = '#1a1a1a';
  sigVuota = true;

  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const t = e.touches && e.touches[0] ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function start(e) {
    e.preventDefault();
    sigDrawing = true;
    const p = pos(e);
    sigCtx.beginPath();
    sigCtx.moveTo(p.x, p.y);
    const ph = document.getElementById('sig-placeholder');
    if (ph) ph.style.display = 'none';
  }
  function move(e) {
    if (!sigDrawing) return;
    e.preventDefault();
    const p = pos(e);
    sigCtx.lineTo(p.x, p.y);
    sigCtx.stroke();
    sigVuota = false;
  }
  function end(e) { sigDrawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive:false });
  canvas.addEventListener('touchmove', move, { passive:false });
  canvas.addEventListener('touchend', end);
}

/* ========== Foto documento (fronte/retro), ridimensionate prima di essere inviate ========== */
function ridimensionaFotoDoc(file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var maxLato = 1400;
        var w = img.width, h = img.height;
        if (w > maxLato || h > maxLato) {
          if (w > h) { h = Math.round(h * maxLato / w); w = maxLato; }
          else { w = Math.round(w * maxLato / h); h = maxLato; }
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function caricaFotoDoc(input, i, lato) {
  var file = input.files && input.files[0];
  if (!file) return;
  try {
    var dataUrl = await ridimensionaFotoDoc(file);
    fotoDocumenti[i + '-' + lato] = dataUrl;
    var img = document.getElementById('dp-' + lato + '-img-' + i);
    if (img) { img.src = dataUrl; img.style.display = 'block'; }
  } catch (e) {
    alert('Impossibile caricare la foto — riprova.');
  }
}

function pulisciFirma() {
  const canvas = document.getElementById('sig-canvas');
  if (!canvas || !sigCtx) return;
  sigCtx.clearRect(0, 0, canvas.width, canvas.height);
  sigVuota = true;
  const ph = document.getElementById('sig-placeholder');
  if (ph) ph.style.display = 'block';
}

function firmaDataUrl() {
  const canvas = document.getElementById('sig-canvas');
  if (!canvas || sigVuota) return '';
  // Ridisegna su sfondo bianco (il canvas è trasparente) prima di esportare
  const out = document.createElement('canvas');
  out.width = canvas.width; out.height = canvas.height;
  const octx = out.getContext('2d');
  octx.fillStyle = '#fff';
  octx.fillRect(0, 0, out.width, out.height);
  octx.drawImage(canvas, 0, 0);
  return out.toDataURL('image/png');
}

    const nome = (document.getElementById('g-nome-'+i)||{value:''}).value.trim();
    if (!cognome || !nome) {
      alert('Compila almeno cognome e nome per ogni ospite (ospite ' + (i+1) + ' mancante).');
      return;
    }
    var tipoDoc = (document.getElementById('g-tipodoc-'+i)||{value:''}).value;
    var numDoc = (document.getElementById('g-numdoc-'+i)||{value:''}).value.trim();
    if (i === 0 && (!tipoDoc || !numDoc)) {
      alert('Per l\'intestatario della prenotazione (ospite 1) sono obbligatori tipo e numero di documento.');
      return;
    }
    if (i === 0 && !fotoDocumenti['0-fronte'] && !fotoDocumenti['0-retro']) {
      alert('Per l\'intestatario della prenotazione (ospite 1) è obbligatoria almeno una foto del documento (fronte o retro).');
      return;
    }
    componenti.push({
      cognome: cognome,
      nome: nome,
      sesso: (document.getElementById('g-sesso-'+i)||{value:'M'}).value,
      dataNascita: (document.getElementById('g-nascita-'+i)||{value:''}).value,
      luogoNascita: (document.getElementById('g-luogonascita-'+i)||{value:''}).value.trim(),
      cittadinanza: (document.getElementById('g-cittadinanza-'+i)||{value:''}).value.trim(),
      statoResidenza: (document.getElementById('g-statores-'+i)||{value:''}).value.trim(),
      residenza: (document.getElementById('g-residenza-'+i)||{value:''}).value.trim(),
      indirizzo: (document.getElementById('g-indirizzo-'+i)||{value:''}).value.trim(),
      cap: (document.getElementById('g-cap-'+i)||{value:''}).value.trim(),
      tipoDoc: tipoDoc,
      numDoc: numDoc,
      fotoDocFronte: fotoDocumenti[i+'-fronte'] || '',
      fotoDocRetro: fotoDocumenti[i+'-retro'] || '',
    });
  }

  const consenso = document.getElementById('consenso-privacy');
  if (!consenso || !consenso.checked) {
    alert('Per procedere è necessario accettare il consenso al trattamento dei dati personali.');
    return;
  }
  const firma = firmaDataUrl();
  if (!firma) {
    alert('Per procedere è necessario firmare nell\'apposito riquadro.');
    return;
  }

  const btn = document.getElementById('btn-invia');
  btn.disabled = true;
  btn.textContent = 'Invio in corso…';

  try {
    const res = await fetch(FUNZIONE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({
        token: token,
        componenti: componenti,
        consensoPrivacy: true,
        consensoData: new Date().toISOString(),
        firma: firma
      })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.errore || 'Invio non riuscito');
    const guideCardHtml = document.getElementById('guide-card') ? document.getElementById('guide-card').outerHTML : '';
    document.getElementById('content').innerHTML =
      '<div class="card"><div class="ok-box">' +
        '<div class="tick">✅</div>' +
        '<h2>Check-in completato!</h2>' +
        '<p style="color:#8a7a77;font-size:13.5px">Grazie, i tuoi dati sono stati ricevuti correttamente.<br>Ti aspettiamo a Greta\'s House!</p>' +
      '</div></div>' + guideCardHtml;
    caricaGuida();
  } catch (err) {
    btn.disabled = false;
    btn.textContent = '✅ Invia i miei dati';
    alert('Invio non riuscito: ' + (err.message || 'errore sconosciuto') + '\nRiprova tra poco.');
  }
}

/* ========== Guida al soggiorno (letta direttamente da Supabase, stessa "guidaOspiti" del gestionale) ========== */
let guidaCache = null;

function toggleGuida() {
  const toggle = document.getElementById('guide-toggle');
  const body = document.getElementById('guide-body');
  if (!toggle || !body) return;
  const apri = !body.classList.contains('open');
  toggle.classList.toggle('open', apri);
  body.classList.toggle('open', apri);
}

async function caricaGuida() {
  const body = document.getElementById('guide-body');
  if (!body) return;
  if (guidaCache) { renderGuida(guidaCache); return; }
  try {
    // Letta dallo "sportello pubblico" (funzione blob_pubblico su Supabase): la tabella app_blobs
    // non è più leggibile direttamente da chi non ha fatto il login.
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/blob_pubblico', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ k: 'guidaOspiti' })
    });
    const risposta = res.ok ? await res.json() : null;
    const d = (risposta && typeof risposta === 'object' && !Array.isArray(risposta)) ? risposta : null;
    if (!d) {
      body.innerHTML = '<div style="font-size:12.5px;color:#9a8b88;padding:10px 0">Guida non ancora disponibile — contattaci per qualsiasi informazione sul soggiorno.</div>';
      return;
    }
    guidaCache = d;
    renderGuida(d);
  } catch (e) {
    body.innerHTML = '<div style="font-size:12.5px;color:#9a8b88;padding:10px 0">Guida momentaneamente non disponibile.</div>';
  }
}

function renderGuida(d) {
  const body = document.getElementById('guide-body');
  if (!body) return;
  let html = '';
  if (d.welcome) html += '<div class="guide-welcome">' + escHtml(d.welcome) + '</div>';

  if (d.info && d.info.length) {
    html += '<div class="guide-sec"><h4>Informazioni utili</h4>' +
      d.info.map(f => '<div class="guide-info-row"><span>'+escHtml(f.label)+'</span><span>'+escHtml(f.value)+'</span></div>').join('') +
      '</div>';
  }
  if (d.contacts && d.contacts.length) {
    html += '<div class="guide-sec"><h4>Contatti utili</h4>' +
      d.contacts.map(c => '<div class="guide-contact"><span class="gi">'+escHtml(c.icon||'📞')+'</span><div><div class="gc-label">'+escHtml(c.label)+'</div><div class="gc-main">'+escHtml(c.main)+'</div>'+(c.sub?'<div class="gc-sub">'+escHtml(c.sub)+'</div>':'')+'</div></div>').join('') +
      '</div>';
  }
  const listSec = (title, arr) => {
    if (!arr || !arr.length) return '';
    return '<div class="guide-sec"><h4>'+title+'</h4>' +
      arr.map(it => '<div class="guide-item"><span class="gi-name">'+escHtml(it.emoji||'📍')+' '+escHtml(it.name)+'</span><div class="gi-desc">'+escHtml(it.desc)+'</div>'+(it.dist?'<div class="gi-dist">'+escHtml(it.dist)+'</div>':'')+'</div>').join('') +
      '</div>';
  };
  html += listSec('Dove mangiare', d.rest);
  html += listSec('Spiagge', d.beach);
  html += listSec('Da vedere', d.visit);
  html += listSec('Attività ed esperienze', d.act);

  if (d.rules && d.rules.length) {
    html += '<div class="guide-sec"><h4>Regole della casa</h4>' +
      d.rules.map(r => '<div class="guide-rule"><span>'+escHtml(r.icon||'📝')+'</span><span>'+escHtml(r.text)+'</span></div>').join('') +
      '</div>';
  }
  if (d.appliances && d.appliances.length) {
    html += '<div class="guide-sec"><h4>Elettrodomestici e comfort</h4>' +
      d.appliances.map(a => {
        const foto = (a.photos||[]).map(p => '<img src="'+p+'">').join('');
        return '<div class="guide-appliance"><div class="ga-name">'+escHtml(a.name)+'</div><div class="ga-instr">'+escHtml(a.instructions)+'</div>'+(foto?'<div class="ga-photos">'+foto+'</div>':'')+'</div>';
      }).join('') +
      '</div>';
  }
  if (d.footer) html += '<div class="guide-footer">' + escHtml(d.footer) + '</div>';

  body.innerHTML = html || '<div style="font-size:12.5px;color:#9a8b88;padding:10px 0">Guida non ancora disponibile.</div>';
}

carica();
</script>
